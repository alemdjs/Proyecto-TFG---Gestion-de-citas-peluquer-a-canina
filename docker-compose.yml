name: peluqueria-canina

services:
  postgres:
    image: postgres:16-alpine
    container_name: peluqueria-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: peluqueria
      POSTGRES_PASSWORD: peluqueria
      POSTGRES_DB: peluqueria
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peluqueria -d peluqueria"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
